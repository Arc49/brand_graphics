<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion Stage</title>
<link rel="stylesheet" href="lib/base.css">
</head>
<body>
<div id="frame"><div id="stage"></div></div>
<div id="ui" hidden>
  <div class="row">
    <select id="tpl"></select>
    <select id="fmt"></select>
    <select id="theme"></select>
    <select id="bgsel">
      <option value="footage">BG: sample footage</option>
      <option value="checker">BG: checker (alpha)</option>
      <option value="black">BG: black</option>
      <option value="white">BG: white</option>
    </select>
    <label><input type="checkbox" id="snd" checked> sound</label>
    <button id="play">▶ Play</button>
    <span id="time">0.00s</span>
  </div>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <div id="cues"></div>
  <textarea id="props" spellcheck="false"></textarea>
</div>
<script src="lib/core.js"></script>
<script src="lib/stage.js"></script>
</body>
</html>
